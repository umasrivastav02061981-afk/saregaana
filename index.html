<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a0f0a">
  <title>सारेगाना · Saregaana</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e0a82e'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%231a0f0a'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%23e0a82e'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles/fonts.css">
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/base.css">
</head>
<body class="booting">

  <!-- The shell: sections are loaded into these empty slots -->
  <div id="app">
    <main id="screen" aria-live="polite"></main>
    <div id="mini"></div>   <!-- mini player (Step 2) -->
    <div id="nav"></div>    <!-- bottom navigation -->
  </div>
  <div id="toast"></div>

  <noscript>Saregaana needs JavaScript to run.</noscript>

  <!-- Order matters: utils -> bus -> loader -> db -> tags -> player -> app -->
  <script src="core/utils.js"></script>
  <script src="core/bus.js"></script>
  <script src="core/loader.js"></script>
  <script src="core/db.js"></script>
  <script src="core/tags.js"></script>
  <script src="core/player.js"></script>
  <script src="core/app.js"></script>
</body>
</html>
