<section class="radio">

  <header class="rd-top">
    <div>
      <p class="rd-hi" lang="hi" id="rdHi">नमस्ते</p>
      <p class="rd-en" id="rdEn">Hello</p>
    </div>
    <div class="rd-air" id="rdAir"><i></i>ON AIR</div>
  </header>

  <!-- the radio -->
  <div class="rd-cabinet">
    <div class="rd-glass" id="rdGlass">
      <div class="rd-scale" id="rdScale"></div>
      <div class="rd-needle"></div>
      <div class="rd-freq"><b id="rdFreq">92.5</b><small>MHz</small></div>
      <span class="rd-gname" lang="hi" id="rdGname"></span>
    </div>

    <div class="rd-lower">
      <div class="rd-grille" aria-hidden="true"></div>

      <div class="rd-vu" aria-hidden="true">
        <div class="vu"><i></i></div>
        <div class="vu v2"><i></i></div>
      </div>

      <div class="rd-knob-wrap">
        <div class="rd-knob" id="rdKnob" role="slider" tabindex="0" aria-label="Tuning knob"
             aria-valuemin="88" aria-valuemax="108" aria-valuenow="92.5"><i></i></div>
        <span>TUNE</span>
      </div>
    </div>
  </div>

  <!-- station push-buttons -->
  <div class="rd-presets" id="rdPresets"></div>

  <!-- station "poster" card -->
  <article class="rd-card" id="rdCard">
    <p class="rd-era" id="rdCardEra"></p>
    <h2 class="rd-card-hi" lang="hi" id="rdCardHi"></h2>
    <p class="rd-card-en" id="rdCardEn"></p>
    <p class="rd-count" id="rdCount"></p>
    <div class="rd-actions">
      <button class="rd-play" id="rdPlay" type="button">▶ <span lang="hi">बजाएँ</span> · Play</button>
      <button class="rd-add" id="rdAdd" type="button">+ <span lang="hi">गाने जोड़ें</span></button>
    </div>
  </article>

  <!-- quick shortcuts -->
  <div class="rd-quick">
    <button type="button" data-go="library"><b lang="hi">संग्रह</b><small>Library</small></button>
    <button type="button" data-go="playlists"><b lang="hi">प्लेलिस्ट</b><small>Playlists</small></button>
    <button type="button" data-go="add"><b lang="hi">नया रिकॉर्ड</b><small>New record</small></button>
  </div>

</section>
